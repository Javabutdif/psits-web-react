name: AI PR Review

on:
  pull_request_target:
    branches:
      - staging
      - master
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          gh pr view "$PR_NUMBER" \
            --json number,title,body,baseRefName,headRefName,headRepository \
            > pr.json

          gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --header "Accept: application/vnd.github.v3.diff" \
            > pr.diff

          MAX_DIFF_BYTES=120000
          if [ "$(wc -c < pr.diff)" -gt "$MAX_DIFF_BYTES" ]; then
            head -c "$MAX_DIFF_BYTES" pr.diff > pr.diff.tmp
            mv pr.diff.tmp pr.diff
            printf '\n\n[Diff truncated at %s bytes]\n' "$MAX_DIFF_BYTES" >> pr.diff
          fi

      - name: Get repository structure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api \
            "repos/${GITHUB_REPOSITORY}/git/trees/${{ github.event.pull_request.base.sha }}?recursive=1" \
            --jq '.tree[] | select(.type == "blob") | .path' \
            > repository-structure.txt

          grep -Ev \
            '(^|/)(node_modules|vendor|dist|build|coverage|\.git)(/|$)|(^|/)(\.env|\.env\..*)$|(^|/)(.*\.(pem|key|crt|p12|pfx))$' \
            repository-structure.txt \
            | sort \
            | head -n 2000 \
            > repository-structure.filtered.txt

      - name: Prepare review prompt
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json

          with open('pr.json', 'r', encoding='utf-8') as f:
              pr = json.load(f)

          with open('repository-structure.filtered.txt', 'r', encoding='utf-8') as f:
              structure = f.read()

          with open('pr.diff', 'r', encoding='utf-8') as f:
              diff = f.read()

          prompt = f"""
          Pull Request #{pr['number']}

          Target: {pr['baseRefName']}
          Source: {pr['headRefName']}
          Repo: {pr['headRepository']['nameWithOwner'] if pr.get('headRepository') else 'unknown'}
          Title: {pr['title']}
          Description: {pr['body'] or '(none)'}

          REPOSITORY STRUCTURE
          {structure}

          DIFF
          {diff}
          """

          with open('review-request.txt', 'w', encoding='utf-8') as f:
              f.write(prompt)
          PY

      - name: Run OpenAI review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "${OPENAI_API_KEY:-}" ] || { echo "Missing OPENAI_API_KEY"; exit 1; }

          python3 <<'PY'
          import json, os, urllib.request, urllib.error

          with open('review-request.txt', 'r', encoding='utf-8') as f:
              user_prompt = f.read()

          system_prompt = """
          You are a senior software engineer reviewing a pull request.

          Review only actionable issues.
          Focus on correctness, security, architecture, business logic, and regressions.
          Ignore style, formatting, naming, and speculative concerns.
          If no actionable issue exists, respond exactly:
          No actionable issues found.

          Output format:
          Overall: ALIGNED | ALIGNED WITH CONCERNS | NOT ALIGNED

          Then, if findings exist:
          ### [Severity] Title
          **File:** exact/path
          **Problem:** ...
          **Why it matters:** ...
          **Recommendation:** ...

          Finish with:
          ### Summary
          One short paragraph.
          """

          payload = {
              "model": "gpt-4o-mini",
              "temperature": 0,
              "max_tokens": 1800,
              "messages": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": user_prompt}
              ],
          }

          api_key = os.environ.get("OPENAI_API_KEY", "").strip()
          if not api_key:
              raise RuntimeError("OPENAI_API_KEY is missing or blank")

          request = urllib.request.Request(
              "https://api.openai.com/v1/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "Accept": "application/json"
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              print(f"OpenAI API returned HTTP {error.code}")
              print(body[:4000])
              raise

          review = result["choices"][0]["message"]["content"]
          with open("review.md", "w", encoding="utf-8") as f:
              f.write(review)
          PY

      - name: Publish AI review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json, os, urllib.request, urllib.error

          with open('review.md', 'r', encoding='utf-8') as f:
              review = f.read()

          body = f"""## AI Code Review

          {review}

          ---
          *Automated review.*
          """

          payload = {
              "commit_id": os.environ["HEAD_SHA"],
              "body": body,
              "event": "COMMENT"
          }

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{os.environ['PR_NUMBER']}/reviews",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN'].strip()}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2026-03-10",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.loads(response.read().decode("utf-8"))
                  print(f"Created AI review: {result.get('html_url', 'unknown')}")
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              print(f"GitHub API returned HTTP {error.code}")
              print(body[:4000])
              raise
          PY
