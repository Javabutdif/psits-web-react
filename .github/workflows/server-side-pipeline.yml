name: PSITS Server

on:
  pull_request:
    branches:
      - master
      - staging
      - production
    paths:
      - 'server-side/**'
      - '.github/workflows/server-side-pipeline.yml'

jobs:
  security-gate:
    name: SCA Gate
    uses: ./.github/workflows/sca.yml
    secrets: inherit
    with:
      threshold: high

  build:
    name: Build Project
    needs: security-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Locate Server side directory
        working-directory: server-side
        run: |
          ls -la

      - name: Setup Node
        uses: actions/setup-node@v1
        with:
          node-version: 16

      - name: Install Dependencies
        working-directory: server-side
        run: npm install

      - name: Build Project
        working-directory: server-side
        run: npm run build
