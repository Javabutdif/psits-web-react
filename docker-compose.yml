services:
  server:
    build: ./server-side
    ports:
      - "${SERVER_PORT:-5000}:5000"
    env_file:
      - path: ./server-side/.env
        required: false
    environment:
      PORT: "5000"
    volumes:
      - ./server-side/src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  client:
    build: ./client-side-ts
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: "http://server:5000"
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./client-side-ts/src:/app/src
      - /app/node_modules
